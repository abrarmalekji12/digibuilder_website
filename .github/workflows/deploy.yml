name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digibuilder-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css experience.css app.js experience.js digibuilder-logo.webp _site/

          # GitHub Pages and browsers can keep unchanged asset URLs cached after a deploy.
          # Version every production asset with this commit so a new release always loads
          # its matching CSS/JS rather than mixing the new HTML with stale tower assets.
          python3 - <<'PY'
          import os
          from pathlib import Path

          index = Path('_site/index.html')
          version = os.environ['GITHUB_SHA'][:12]
          html = index.read_text(encoding='utf-8')
          for asset in ('styles.css', 'experience.css', 'app.js', 'experience.js', 'digibuilder-logo.webp'):
              html = html.replace(f'"{asset}"', f'"{asset}?v={version}"')
          index.write_text(html, encoding='utf-8')
          PY

          printf 'digibuilderai.com\n' > _site/CNAME
          touch _site/.nojekyll

      - name: Deploy building landing page
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          cname: digibuilderai.com
