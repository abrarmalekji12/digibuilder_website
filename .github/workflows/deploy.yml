name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digibuilder-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css experience.css app.js experience.js digibuilder-logo.webp _site/
          printf 'digibuilderai.com\n' > _site/CNAME
          touch _site/.nojekyll

      - name: Deploy building landing page
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          cname: digibuilderai.com
